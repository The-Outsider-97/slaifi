# SLAIFI settings, read through SLAI's ConfigRepository. Every value is optional; the values below are the defaults.
# A SLAIFI_* environment variable (or a line in applications\slaifi\.env or <SLAI root>\.env) overrides the matching value here.
# API keys never belong in this file: put SLAIFI_TWELVEDATA_API_KEY, SLAIFI_TIINGO_API_KEY, SLAIFI_FMP_API_KEY,
# SLAIFI_FINNHUB_API_KEY and SLAIFI_ALPHAVANTAGE_API_KEY in applications\slaifi\.env (copy of .env.example) or the environment.
app:
  port: 8777                    # where SLAIFI listens (127.0.0.1 only)
  log_level: INFO               # DEBUG, INFO, WARNING, ERROR or CRITICAL
  market_provider_order: twelvedata,tiingo,fmp,finnhub,alphavantage   # which market-data source is asked first
  market_quote_cache_ttl_seconds: 60       # how long a fresh quote is reused (protects the free quotas)
  market_history_cache_ttl_seconds: 300
